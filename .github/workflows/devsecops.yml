name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controle des dependances avec Trivy
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4
      - name: Controle du Dockerfile avec Trivy
        run: |
          d=$(mktemp -d)
          cp Dockerfile "$d/Dockerfile"
          docker run --rm \
            -v "$d":/scan \
            aquasec/trivy:latest config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /scan

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
